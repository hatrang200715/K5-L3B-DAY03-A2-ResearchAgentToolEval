tools:
  - name: clarify
    description: "Ask the user for missing information or explicit yes/no approval before an external action. If the user asks to send, post, or publish, use response_type yes_no for the approval check even when the content or destination still needs clarification; include the missing detail in the question. Do not use when the request is complete and safe to answer or research."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "One concise question asking only for the missing detail or approval."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for ordinary missing details, yes_no for every send/post/publish approval check, and choice only when offering options."}
        options: {type: array, default: [], items: {type: string}, description: "Choices to show only when response_type is choice."}
      required: [question, response_type]

  - name: timeline
    description: "Fetch recent posts from one identified social account. Use for posts by a named account, not for topic-wide searches (use social_search) or web/news research (use lookup); if the account is unclear, call clarify instead of guessing."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without a leading @ (for example, elonmusk); preserve a supplied handle and do not invent one."}
        limit: {type: integer, default: 5, description: "Number of posts requested; use the user's exact number, otherwise 5."}
      required: [screenname]

  - name: social_search
    description: "Search social posts by topic or keywords. Use when the user explicitly asks what people are posting or discussing on social media; do not use for one named account (use timeline) or web articles/news (use lookup). If a follow-up changes the topic after a web/news search, keep using lookup unless the user switches to social media."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Use the requested topic/keywords without adding terms that belong in other parameters."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Use Top only for popular/top posts; otherwise use Latest."}
        limit: {type: integer, default: 5, description: "Number of posts requested; use the user's exact number, otherwise 5."}
      required: [query]

  - name: lookup
    description: "Search the web for information, including current news. Use for web research; for a supplied URL use fetch, and for social posts use timeline or social_search. Keep using lookup for ambiguous follow-ups to a web/news search, carrying forward its topic and timeframe unless the user changes them. Put news and date constraints in topic/timeframe rather than adding them to query."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Concise subject only (for example, AI); do not append 'news' or a date when those are specified separately."}
        topic: {type: string, enum: [general, news], default: "general", description: "Set to news for a news request; otherwise general."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Use day for today, week for this week, month for this month, or year for this year; otherwise week."}
        max_results: {type: integer, default: 5, description: "Maximum number of web results to return."}
      required: [query]

  - name: fetch
    description: "Read and summarize content at a specific URL supplied by the user or returned by research. Use only when the URL is known; do not guess an article URL (ask with clarify instead)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The exact URL to read; do not replace or infer a missing URL."}
      required: [url]

  - name: format
    description: "Format already retrieved items as a digest or post. Use only after the relevant content is available; do not use to search for or fetch missing information."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "The items already retrieved and to be formatted."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Choose the requested format; otherwise use sections."}
        headline: {type: string, default: "", description: "Optional headline requested by the user."}
      required: [items, template]

  - name: send
    description: "Send text to the configured Telegram destination. Use only after the user explicitly confirms the exact text and destination in response to a confirmation request; never use to draft, preview, or send an unapproved or ambiguous request."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The exact user-approved text to send; do not rewrite it after approval."}
        confirmed: {type: boolean, default: false, description: "Set true only after explicit user approval of this exact text and destination; otherwise do not call send."}
      required: [text]

  - name: policy
    description: "Search internal company policy documents. Use for questions about organizational policy; do not use for general web research or academic papers."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "The policy question or terms to search."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Choose the matching policy area, or all if unclear."}
        top_k: {type: integer, default: 3, description: "Maximum number of relevant policy sections."}
      required: [query]

  - name: papers
    description: "Search arXiv for academic papers. Use for scholarly literature; do not use for current news, social posts, or reading a specific known paper (use paper_text)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Research topic or keywords to search on arXiv."}
        max_results: {type: integer, default: 5, description: "Maximum number of papers to return."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Use relevance unless the user asks for recently updated or submitted papers."}
      required: [query]

  - name: paper_text
    description: "Extract text from a specific arXiv paper. Use when the user provides an arXiv ID or URL, or after papers returns a paper to read; do not use to discover papers (use papers)."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "The exact arXiv ID or URL; do not invent a paper identifier."}
        max_pages: {type: integer, default: 5, description: "Maximum pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum characters to return."}
      required: [arxiv_url]

# ---------------- New tools (role B) ----------------
  - name: hn_search
    description: "Tìm bài (story) và thảo luận trên Hacker News theo từ khóa, trả về tiêu đề, link, điểm và số bình luận. DÙNG khi user nhắc Hacker News / HN, hoặc muốn biết cộng đồng lập trình viên / dân tech đang bàn gì về một chủ đề. KHÔNG dùng cho tin tức web chung (dùng lookup), tweet/bài trên X (dùng social_search hoặc timeline), hay đọc nội dung một URL (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/từ khóa cốt lõi, ngắn gọn, giữ nguyên từ user dùng (vd. \"LLM agents\", \"Rust\"). Không thêm các từ 'Hacker News', 'HN', 'hôm nay', 'mới nhất'."}
        limit: {type: integer, default: 5, description: "Số bài cần lấy, từ 1 đến 20. Dùng đúng con số user nói; không nói thì để mặc định 5."}
      required: [query]

  - name: reading_time
    description: "Đếm số từ, số ký tự và ước tính số phút đọc của một đoạn văn bản ĐÃ CÓ (user dán vào hoặc lấy từ kết quả tool trước). Chạy local. DÙNG khi user hỏi bài này dài bao nhiêu, mấy chữ, đọc mất bao lâu. KHÔNG dùng để tìm hay đọc nội dung từ URL (dùng fetch trước), không dùng để tóm tắt."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Toàn bộ văn bản cần đo, nguyên văn. Không truyền URL."}
        words_per_minute: {type: integer, default: 200, description: "Tốc độ đọc (từ/phút), số nguyên > 0. Chỉ đổi khi user nói rõ tốc độ; mặc định 200."}
      required: [text]

  - name: extract_links
    description: "Trích danh sách URL http(s) có trong một đoạn văn bản ĐÃ CÓ, giữ thứ tự, bỏ trùng. Chạy local, không mở link. DÙNG khi user dán một đoạn text/email/bài viết và muốn lấy ra các link trong đó. KHÔNG dùng để đọc nội dung link (dùng fetch) hay tìm link mới trên web (dùng lookup)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản nguyên văn chứa các link cần trích."}
        limit: {type: integer, default: 20, description: "Số link tối đa trả về, 1–100; mặc định 20."}
      required: [text]

  - name: dedupe_items
    description: "Lọc các item trùng nhau (cùng URL sau khi chuẩn hoá, hoặc cùng tiêu đề nếu không có URL) trong danh sách kết quả ĐÃ GOM từ các tool khác, giữ item đầu tiên. Chạy local. DÙNG khi đã có kết quả từ nhiều nguồn (vd. lookup + hn_search) và cần bỏ trùng trước khi format. KHÔNG dùng khi chưa có item nào, và không dùng để tìm kiếm."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã có, mỗi item là object có url và/hoặc title (giữ nguyên các field khác)."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
      required: [items]
